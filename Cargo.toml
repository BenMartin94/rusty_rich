[package]
name = "rusty_rich"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
complex-bessel = "0.3.0"
faer = "0.24.4"
kryst = { version = "4.3.0", features = ["complex"] }
nalgebra = "0.35.0"
num-complex = "0.4.6"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4"] }
